[project]
name = "geo-processor-api-backend"
version = "0.1.0"
description = "Codebranch geo-processor Api backend (FastAPI) "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "ruff>=0.11.11",
    "requests>=2.32.3",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.1",
    "pytest-asyncio>=0.26.0",
]
