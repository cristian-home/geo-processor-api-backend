version: '3.8'

services:
  geo-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uv run python main.py
    
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.tests
    environment:
      - PYTHONUNBUFFERED=1
